# Builds the server-ce (sharelatex monolith) image from this fork and pushes
# to GHCR. The same image is then pulled by our prod compose to run the
# patched Overleaf web with the R2 + clsi-rs integration.
#
# Runner: Blacksmith (configured org-level). Larger runner because the build
# does an npm install across the whole monorepo (~3000 packages).

name: build-server-ce

on:
  push:
    branches:
      - main
      - ambersys/**
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/overleaf-base
  IMAGE_CE: ghcr.io/${{ github.repository_owner }}/overleaf

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: tags
        run: |
          SHA="${GITHUB_SHA::12}"
          BRANCH="${GITHUB_REF_NAME//\//-}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- Base image (heavy: bullseye + perl + texlive bits etc.) ----
      # type=gha cache instead of type=registry to dodge GHCR's blob-permission
      # tangle around recreated packages. gha cache is stored in GitHub's
      # Actions cache (scoped to this repo, 10GB quota) so it's also tidier.
      - name: Build + push overleaf-base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server-ce/Dockerfile-base
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}:${{ steps.tags.outputs.branch }}
            ${{ env.IMAGE_BASE }}:${{ steps.tags.outputs.branch }}-${{ steps.tags.outputs.sha }}
          cache-from: type=gha,scope=overleaf-base
          cache-to: type=gha,scope=overleaf-base,mode=max

      # ---- Community Edition image (npm install + bundling) ----
      - name: Build + push overleaf
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server-ce/Dockerfile
          push: true
          build-args: |
            OVERLEAF_BASE_TAG=${{ env.IMAGE_BASE }}:${{ steps.tags.outputs.branch }}-${{ steps.tags.outputs.sha }}
            MONOREPO_REVISION=${{ github.sha }}
            BRANCH_NAME=${{ github.ref_name }}
          tags: |
            ${{ env.IMAGE_CE }}:${{ steps.tags.outputs.branch }}
            ${{ env.IMAGE_CE }}:${{ steps.tags.outputs.branch }}-${{ steps.tags.outputs.sha }}
          cache-from: type=gha,scope=overleaf-ce
          cache-to: type=gha,scope=overleaf-ce,mode=max
