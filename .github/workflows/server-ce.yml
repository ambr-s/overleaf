# Build the server-ce (sharelatex monolith) image from this fork and push to
# GHCR. We use upstream's published sharelatex/sharelatex-base:6.1.0 as the
# base — none of our patches touch the base layer (texlive/nginx/runit/etc.),
# so building it ourselves is wasted minutes + storage.
#
# Runner: Blacksmith (configured org-level). The npm install across the
# monorepo is the slow part; CPU-heavier runner = faster.

name: build-server-ce

on:
  push:
    branches:
      - main
      - ambersys/**
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_CE: ghcr.io/${{ github.repository_owner }}/overleaf-ce
  # Pin to the base version matching CE 6.1.2 (base doesn't bump per CE patch).
  OVERLEAF_BASE_TAG: docker.io/sharelatex/sharelatex-base:6.1.0

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: tags
        run: |
          SHA="${GITHUB_SHA::12}"
          BRANCH="${GITHUB_REF_NAME//\//-}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- Community Edition image (npm install + bundling on top of upstream base) ----
      - name: Build + push overleaf-ce
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server-ce/Dockerfile
          push: true
          build-args: |
            OVERLEAF_BASE_TAG=${{ env.OVERLEAF_BASE_TAG }}
            MONOREPO_REVISION=${{ github.sha }}
            BRANCH_NAME=${{ github.ref_name }}
          tags: |
            ${{ env.IMAGE_CE }}:${{ steps.tags.outputs.branch }}
            ${{ env.IMAGE_CE }}:${{ steps.tags.outputs.branch }}-${{ steps.tags.outputs.sha }}
          cache-from: type=gha,scope=overleaf-ce
          cache-to: type=gha,scope=overleaf-ce,mode=max
